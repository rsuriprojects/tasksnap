<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>tasksnap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
    --bg: #f2f2f4; --surface: #ffffff; --surface2: #f7f7f9;
    --text: #1a1a1a; --text2: #6e6e73;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
    --radius: 16px; --radius-sm: 10px; --radius-pill: 99px;
    --font: 'DM Sans', -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #1c1c1e; --surface2: #2c2c2e;
      --text: #f0f0f2; --text2: #8e8e93;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --green-light: rgba(29,158,117,0.15);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font); background: var(--bg); min-height: 100vh; display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 430px; min-height: 100vh; background: var(--bg); padding-bottom: 140px; }

  .topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 56px 20px 0; position: sticky; top: 0; z-index: 10; }
  .topbar-inner { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 10px; }
  .brand { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; }
  .brand span { color: var(--green); }
  .date-str { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .ai-btn { background: var(--green); border: none; border-radius: var(--radius-pill); padding: 8px 14px; color: white; font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .ai-btn:active { opacity: 0.8; }

  .view-tabs { display: flex; border-top: 0.5px solid var(--border); }
  .view-tab { flex: 1; padding: 10px; font-family: var(--font); font-size: 13px; font-weight: 500; background: none; border: none; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; transition: all 0.15s; }
  .view-tab.active { color: var(--green); border-bottom-color: var(--green); }

  .progress-wrap { padding: 14px 20px 0; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-count { font-size: 13px; color: var(--text2); }
  .progress-pct { font-size: 13px; font-weight: 500; color: var(--green); }
  .bar-bg { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 5px; background: var(--green); border-radius: 99px; transition: width 0.35s ease; }

  .day-tabs-wrap { padding: 14px 20px 0; overflow-x: auto; scrollbar-width: none; }
  .day-tabs-wrap::-webkit-scrollbar { display: none; }
  .day-tabs { display: flex; gap: 6px; }
  .day-tab { flex-shrink: 0; padding: 6px 14px; border-radius: var(--radius-pill); border: 0.5px solid var(--border2); font-size: 13px; font-family: var(--font); cursor: pointer; color: var(--text2); background: var(--surface); transition: all 0.15s; }
  .day-tab.active { background: var(--green); color: white; border-color: var(--green); font-weight: 500; }
  .day-tab.is-today:not(.active) { border-color: var(--green); color: var(--green); }

  .section { padding: 20px 20px 0; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }

  .task-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 13px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer; transition: background 0.12s; user-select: none; }
  .task-item:active { background: var(--surface2); transform: scale(0.99); }
  .task-item.done { opacity: 0.5; }
  .task-item.done .task-name { text-decoration: line-through; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .task-item.done .check { background: var(--green); border-color: var(--green); }
  .check-icon { width: 12px; height: 12px; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0; transition: opacity 0.15s; }
  .task-item.done .check-icon { opacity: 1; }
  .task-name { font-size: 15px; color: var(--text); flex: 1; }
  .task-tag { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: var(--radius-pill); flex-shrink: 0; }
  .tag-work { background: #EBF3FE; color: #1A56B0; }
  .tag-personal { background: var(--green-light); color: var(--green-dark); }
  .tag-health { background: #FEF3E2; color: #92540A; }
  @media (prefers-color-scheme: dark) {
    .tag-work { background: rgba(56,131,220,0.2); color: #7BB3F0; }
    .tag-personal { background: rgba(29,158,117,0.2); color: #4ECBA4; }
    .tag-health { background: rgba(239,159,39,0.2); color: #F0B84A; }
  }
  .task-delete { background: none; border: none; color: var(--text2); cursor: pointer; padding: 2px; font-size: 16px; opacity: 0; transition: opacity 0.15s; line-height: 1; }
  .task-item:hover .task-delete { opacity: 1; }
  .empty { text-align: center; padding: 2rem; color: var(--text2); font-size: 14px; }

  .log-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .log-bar { width: 3px; border-radius: 99px; background: var(--green); align-self: stretch; flex-shrink: 0; }
  .log-body { flex: 1; }
  .log-activity { font-size: 15px; color: var(--text); font-weight: 500; }
  .log-times { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .log-duration { font-size: 12px; font-weight: 500; color: var(--green); background: var(--green-light); padding: 2px 8px; border-radius: var(--radius-pill); flex-shrink: 0; }
  .log-delete { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; opacity: 0; transition: opacity 0.15s; padding: 2px; }
  .log-item:hover .log-delete { opacity: 1; }

  .add-wrap { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--surface); border-top: 0.5px solid var(--border); padding: 12px 16px 28px; z-index: 20; }
  .add-input { width: 100%; font-family: var(--font); font-size: 15px; padding: 11px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); outline: none; margin-bottom: 8px; }
  .add-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }
  .add-controls { display: flex; gap: 6px; }
  .add-select { flex: 1; font-family: var(--font); font-size: 13px; padding: 8px 6px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); cursor: pointer; outline: none; min-width: 0; }
  .add-time { flex: 1; font-family: var(--font); font-size: 13px; padding: 8px 6px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); outline: none; min-width: 0; }
  .add-time:focus { border-color: var(--green); }
  .add-btn { background: var(--green); color: white; border: none; border-radius: var(--radius-sm); padding: 8px 18px; font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
  .add-btn:hover { background: var(--green-dark); }
  .add-btn:active { transform: scale(0.97); }

  .all-done { background: var(--green-light); border: 0.5px solid rgba(29,158,117,0.25); border-radius: var(--radius); padding: 14px 16px; margin: 0 20px; display: flex; align-items: center; gap: 10px; }
  .all-done-text { font-size: 15px; font-weight: 500; color: var(--green-dark); }
  @media (prefers-color-scheme: dark) { .all-done-text { color: #4ECBA4; } }

  /* AI drawer */
  .ai-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .ai-overlay.open { opacity: 1; pointer-events: all; }
  .ai-drawer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 430px; height: 75vh; background: var(--surface); border-radius: 20px 20px 0 0; z-index: 31; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); }
  .ai-drawer.open { transform: translateX(-50%) translateY(0); }
  .ai-header { padding: 16px 20px 12px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .ai-title { font-size: 16px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .ai-close { background: none; border: none; font-size: 20px; color: var(--text2); cursor: pointer; padding: 2px; }
  .ai-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .ai-msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
  .ai-msg.user { background: var(--green); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .ai-msg.assistant { background: var(--surface2); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; }
  .ai-msg.typing { color: var(--text2); font-style: italic; }
  .ai-input-row { padding: 12px 16px 28px; border-top: 0.5px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
  .ai-input { flex: 1; font-family: var(--font); font-size: 14px; padding: 10px 14px; border-radius: var(--radius-pill); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); outline: none; }
  .ai-input:focus { border-color: var(--green); }
  .ai-send { background: var(--green); color: white; border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ai-send:disabled { opacity: 0.5; cursor: default; }

  /* key setup */
  .key-setup { padding: 24px 20px; text-align: center; }
  .key-setup p { font-size: 14px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
  .key-input { width: 100%; font-family: var(--font); font-size: 14px; padding: 11px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); outline: none; margin-bottom: 10px; }
  .key-input:focus { border-color: var(--green); }
  .key-save { width: 100%; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); padding: 12px; font-family: var(--font); font-size: 15px; font-weight: 500; cursor: pointer; }

  /* password screen */
  .pw-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; z-index: 100; }
  .pw-brand { font-size: 28px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; margin-bottom: 8px; }
  .pw-brand span { color: var(--green); }
  .pw-sub { font-size: 14px; color: var(--text2); margin-bottom: 32px; }
  .pw-input { width: 100%; max-width: 300px; font-family: var(--font); font-size: 16px; padding: 13px 16px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface); color: var(--text); outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 0.1em; }
  .pw-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }
  .pw-btn { width: 100%; max-width: 300px; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); padding: 13px; font-family: var(--font); font-size: 15px; font-weight: 500; cursor: pointer; }
  .pw-error { font-size: 13px; color: #E24B4A; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<!-- password screen -->
<div class="pw-screen" id="pwScreen">
  <div class="pw-brand">task<span>snap</span></div>
  <div class="pw-sub">enter your password to continue</div>
  <input class="pw-input" id="pwInput" type="password" placeholder="password" />
  <button class="pw-btn" onclick="checkPassword()">continue</button>
  <div class="pw-error hidden" id="pwError">incorrect password</div>
</div>

<div class="phone" id="mainApp" style="display:none;">
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">task<span>snap</span></div>
        <div class="date-str" id="dateStr"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="ai-btn" onclick="openAI()">✨ ask ai</button>
        <button onclick="logout()" style="background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;padding:4px;">out</button>
      </div>
    </div>
    <div class="view-tabs">
      <button class="view-tab active" id="tabTasks" onclick="switchView('tasks')">tasks</button>
      <button class="view-tab" id="tabLog" onclick="switchView('log')">time log</button>
    </div>
  </div>

  <div id="viewTasks">
    <div class="progress-wrap">
      <div class="progress-row">
        <span class="progress-count" id="progressCount">0 of 0 done</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
    <div class="day-tabs-wrap"><div class="day-tabs" id="dayTabs"></div></div>
    <div id="mainContent"></div>
  </div>

  <div id="viewLog" class="hidden">
    <div class="day-tabs-wrap"><div class="day-tabs" id="dayTabsLog"></div></div>
    <div id="logContent"></div>
  </div>
</div>

<!-- task add bar -->
<div class="add-wrap" id="addBarTask">
  <input class="add-input" id="addInput" placeholder="add a task…" />
  <div class="add-controls">
    <select class="add-select" id="tagSelect">
      <option value="work">💼 work</option>
      <option value="personal">🌿 personal</option>
      <option value="health">🏃 health</option>
    </select>
    <select class="add-select" id="repeatSelect">
      <option value="once">today only</option>
      <option value="weekdays">every weekday</option>
      <option value="weekends">every weekend</option>
      <option value="daily">every day</option>
    </select>
    <select class="add-select" id="prioritySelect">
      <option value="high">🔴 high</option>
      <option value="medium">🟠 medium</option>
      <option value="low">🟡 low</option>
    </select>
    <button class="add-btn" id="addBtn">add</button>
  </div>
</div>

<!-- log add bar -->
<div class="add-wrap hidden" id="addBarLog">
  <input class="add-input" id="logActivityInput" placeholder="activity name…" />
  <div class="add-controls">
    <input class="add-time" type="time" id="logStart" />
    <input class="add-time" type="time" id="logEnd" />
    <button class="add-btn" id="addLogBtn">log</button>
  </div>
</div>

<!-- AI drawer -->
<div class="ai-overlay" id="aiOverlay" onclick="closeAI()"></div>
<div class="ai-drawer" id="aiDrawer">
  <div class="ai-header">
    <div class="ai-title">✨ tasksnap ai</div>
    <button class="ai-close" onclick="closeAI()">✕</button>
  </div>

  <!-- chat screen -->
  <div id="chatScreen" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div class="ai-messages" id="aiMessages"></div>
    <div class="ai-input-row">
      <input class="ai-input" id="aiInput" placeholder="ask me anything…" />
      <button class="ai-send" id="aiSend" onclick="sendAI()">↑</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const jsDay = new Date().getDay();
const todayIdx = jsDay === 0 ? 6 : jsDay - 1;
const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
const PRIORITY_EMOJI = { high: '🔴', medium: '🟠', low: '🟡' };

let state = JSON.parse(localStorage.getItem('tasksnap_state') || 'null') || {
  activeDay: todayIdx, tasks: [], logs: [], nextId: 1, nextLogId: 1
};
if (!state.logs) state.logs = [];
if (!state.nextLogId) state.nextLogId = 1;

let currentView = 'tasks';
let aiHistory = [];

function save() { localStorage.setItem('tasksnap_state', JSON.stringify(state)); }

function isWeekday(d) { return d >= 0 && d <= 4; }
function isWeekend(d) { return d === 5 || d === 6; }

function taskVisible(task, day) {
  if (task.repeat === 'daily') return true;
  if (task.repeat === 'weekdays') return isWeekday(day);
  if (task.repeat === 'weekends') return isWeekend(day);
  if (task.repeat === 'once') return task.day === day;
  return false;
}

function toggleTask(id) {
  const t = state.tasks.find(t => t.id === id);
  if (t) { t.done[state.activeDay] = !t.done[state.activeDay]; save(); render(); }
}
function deleteTask(id, e) {
  e.stopPropagation();
  state.tasks = state.tasks.filter(t => t.id !== id);
  save(); render();
}
function deleteLog(id, e) {
  e.stopPropagation();
  state.logs = state.logs.filter(l => l.id !== id);
  save(); renderLog();
}

function addTask() {
  const input = document.getElementById('addInput');
  const name = input.value.trim();
  if (!name) return;
  const tag = document.getElementById('tagSelect').value;
  const repeat = document.getElementById('repeatSelect').value;
  const priority = document.getElementById('prioritySelect').value;
  state.tasks.push({ id: state.nextId++, name, tag, repeat, priority, day: state.activeDay, done: {} });
  input.value = '';
  save(); render();
}

function addLog() {
  const activity = document.getElementById('logActivityInput').value.trim();
  const start = document.getElementById('logStart').value;
  const end = document.getElementById('logEnd').value;
  if (!activity || !start || !end) return;
  state.logs.push({ id: state.nextLogId++, activity, start, end, day: state.activeDay });
  document.getElementById('logActivityInput').value = '';
  document.getElementById('logStart').value = '';
  document.getElementById('logEnd').value = '';
  save(); renderLog();
}

function formatTime(t) {
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  return `${h % 12 || 12}:${String(m).padStart(2,'0')}${ampm}`;
}
function calcDuration(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins <= 0) return null;
  const h = Math.floor(mins / 60), m = mins % 60;
  return h === 0 ? `${m}m` : m === 0 ? `${h}h` : `${h}h ${m}m`;
}

document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('addInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
document.getElementById('addLogBtn').addEventListener('click', addLog);
document.getElementById('aiInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendAI(); });

function switchView(view) {
  currentView = view;
  document.getElementById('viewTasks').classList.toggle('hidden', view !== 'tasks');
  document.getElementById('viewLog').classList.toggle('hidden', view !== 'log');
  document.getElementById('addBarTask').classList.toggle('hidden', view !== 'tasks');
  document.getElementById('addBarLog').classList.toggle('hidden', view !== 'log');
  document.getElementById('tabTasks').classList.toggle('active', view === 'tasks');
  document.getElementById('tabLog').classList.toggle('active', view === 'log');
  if (view === 'log') renderLog();
}

function makeDayTabs(containerId) {
  const tabs = document.getElementById(containerId);
  tabs.innerHTML = '';
  DAYS.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === state.activeDay ? ' active' : '') + (i === todayIdx && i !== state.activeDay ? ' is-today' : '');
    btn.textContent = day;
    btn.addEventListener('click', () => { state.activeDay = i; save(); render(); if (currentView === 'log') renderLog(); });
    tabs.appendChild(btn);
  });
}

function makeTaskEl(task) {
  const d = state.activeDay;
  const isDone = !!task.done[d];
  const priority = task.priority || 'medium';
  const emoji = PRIORITY_EMOJI[priority] || '🟠';
  const el = document.createElement('div');
  el.className = 'task-item' + (isDone ? ' done' : '');
  el.innerHTML = `
    <span style="font-size:10px;flex-shrink:0;">${emoji}</span>
    <div class="check"><svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg></div>
    <span class="task-name">${task.name}</span>
    <span class="task-tag tag-${task.tag}">${task.tag}</span>
    <button class="task-delete" aria-label="delete">✕</button>
  `;
  el.addEventListener('click', () => toggleTask(task.id));
  el.querySelector('.task-delete').addEventListener('click', e => deleteTask(task.id, e));
  return el;
}

function sortByPriority(tasks) {
  return [...tasks].sort((a, b) => (PRIORITY_ORDER[a.priority||'medium']) - (PRIORITY_ORDER[b.priority||'medium']));
}

function renderLog() {
  makeDayTabs('dayTabsLog');
  const d = state.activeDay;
  const dayLogs = state.logs.filter(l => l.day === d).sort((a, b) => a.start.localeCompare(b.start));
  const content = document.getElementById('logContent');
  content.innerHTML = '';
  if (!dayLogs.length) {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="empty">no time logs for ${DAYS[d]}<br><span style="font-size:13px">add an activity below</span></div>`;
    content.appendChild(sec); return;
  }
  let totalMins = 0;
  dayLogs.forEach(l => {
    const [sh, sm] = l.start.split(':').map(Number);
    const [eh, em] = l.end.split(':').map(Number);
    const diff = (eh * 60 + em) - (sh * 60 + sm);
    if (diff > 0) totalMins += diff;
  });
  const th = Math.floor(totalMins / 60), tm = totalMins % 60;
  const totalStr = th > 0 ? (tm > 0 ? `${th}h ${tm}m` : `${th}h`) : `${tm}m`;
  const header = document.createElement('div');
  header.className = 'section';
  header.innerHTML = `<div class="section-label">total logged: ${totalStr}</div>`;
  content.appendChild(header);
  const sec = document.createElement('div');
  sec.className = 'section';
  dayLogs.forEach(l => {
    const dur = calcDuration(l.start, l.end);
    const el = document.createElement('div');
    el.className = 'log-item';
    el.innerHTML = `
      <div class="log-bar"></div>
      <div class="log-body">
        <div class="log-activity">${l.activity}</div>
        <div class="log-times">${formatTime(l.start)} → ${formatTime(l.end)}</div>
      </div>
      ${dur ? `<div class="log-duration">${dur}</div>` : ''}
      <button class="log-delete" aria-label="delete">✕</button>
    `;
    el.querySelector('.log-delete').addEventListener('click', e => deleteLog(l.id, e));
    sec.appendChild(el);
  });
  content.appendChild(sec);
}

function render() {
  const d = state.activeDay;
  const now = new Date();
  const showDate = new Date(now);
  const jsTarget = d === 6 ? 0 : d + 1;
  showDate.setDate(now.getDate() + (jsTarget - now.getDay()));
  document.getElementById('dateStr').textContent = showDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  makeDayTabs('dayTabs');
  const visible = state.tasks.filter(t => taskVisible(t, d));
  const recurring = sortByPriority(visible.filter(t => t.repeat !== 'once'));
  const once = sortByPriority(visible.filter(t => t.repeat === 'once'));
  const doneCount = visible.filter(t => t.done[d]).length;
  const pct = visible.length ? Math.round(doneCount / visible.length * 100) : 0;
  document.getElementById('progressCount').textContent = `${doneCount} of ${visible.length} done`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('barFill').style.width = pct + '%';
  const content = document.getElementById('mainContent');
  content.innerHTML = '';
  if (visible.length > 0 && doneCount === visible.length) {
    const banner = document.createElement('div');
    banner.className = 'all-done';
    banner.innerHTML = `<span style="font-size:20px">🎉</span><span class="all-done-text">all done for ${DAYS[d]}!</span>`;
    content.appendChild(banner);
  }
  function renderSection(tasks, label) {
    if (!tasks.length) return;
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-label">${label}</div>`;
    tasks.forEach(t => sec.appendChild(makeTaskEl(t)));
    content.appendChild(sec);
  }
  renderSection(recurring, 'recurring');
  renderSection(once, 'today only');
  if (!visible.length) {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="empty">no tasks for ${DAYS[d]} — add one below</div>`;
    content.appendChild(sec);
  }
}

// ─── AI ASSISTANT ────────────────────────────────────────────

LCSRC NONPROFIT (laduestem.org): Runs about half a day per week. Key summer events: June 20 Boeing STEAMfest booth, June 22–26 FLL Fundraiser Camp ($250/student), July 28–Aug 1 FLL Fundraiser Camp ($250/student), Aug 3–7 Vitendo 4 Africa Camp (pure robotics, grades 3–8).

Today is ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}.

YOU CAN ACTUALLY ADD, COMPLETE, AND DELETE TASKS in the app. When the user asks you to add, complete/check off/mark done, or remove/delete tasks, you MUST include a JSON actions block at the END of your message in this exact format (no exceptions):

~~~actions
[
  {"action":"add","name":"play saxophone","tag":"personal","priority":"high","repeat":"daily"},
  {"action":"complete","name":"play basketball"},
  {"action":"delete","name":"some task"}
]
~~~

Rules: tag = work/personal/health. priority = high/medium/low. repeat = once/daily/weekdays/weekends. Always include the block when task changes are requested. Multiple actions allowed. Tell the user what you did in plain text ABOVE the block.`;

function executeActions(actionsJson) {
  let actions;
  try { actions = JSON.parse(actionsJson); } catch(e) { return; }
  const d = state.activeDay;
  let changed = false;
  actions.forEach(a => {
    if (a.action === 'add') {
      state.tasks.push({ id: state.nextId++, name: a.name, tag: a.tag||'personal', priority: a.priority||'medium', repeat: a.repeat||'once', day: d, done: {} });
      changed = true;
    } else if (a.action === 'complete') {
      const match = state.tasks.find(t => t.name.toLowerCase().includes(a.name.toLowerCase()) || a.name.toLowerCase().includes(t.name.toLowerCase()));
      if (match) { match.done[d] = true; changed = true; }
    } else if (a.action === 'delete') {
      const before = state.tasks.length;
      state.tasks = state.tasks.filter(t => !t.name.toLowerCase().includes(a.name.toLowerCase()));
      if (state.tasks.length !== before) changed = true;
    }
  });
  if (changed) { save(); render(); }
}

function openAI() {
  document.getElementById('aiOverlay').classList.add('open');
  document.getElementById('aiDrawer').classList.add('open');
  if (aiHistory.length === 0) addWelcome();
}

function logout() {
  localStorage.removeItem('tasksnap_pw');
  currentProfile = null;
  aiHistory = [];
  document.getElementById('aiMessages').innerHTML = '';
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('pwScreen').style.display = 'flex';
  document.getElementById('pwInput').value = '';
}

function closeAI() {
  document.getElementById('aiOverlay').classList.remove('open');
  document.getElementById('aiDrawer').classList.remove('open');
}

function addWelcome() {
  const today = DAYS[state.activeDay];
  const name = currentProfile ? currentProfile.name : 'there';
  appendMsg('assistant', `hey ${name}! 👋 today is ${today}. what do you need help with? i can suggest tasks, help you plan your day, or remind you what's coming up.`);
}

function appendMsg(role, text) {
  const msgs = document.getElementById('aiMessages');
  const div = document.createElement('div');
  div.className = `ai-msg ${role}`;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

async function sendAI() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  appendMsg('user', text);
  aiHistory.push({ role: 'user', content: text });

  const sendBtn = document.getElementById('aiSend');
  sendBtn.disabled = true;
  const typing = appendMsg('assistant typing', '...');

  // build context about current tasks
  const d = state.activeDay;
  const todayTasks = state.tasks.filter(t => taskVisible(t, d));
  const doneTasks = todayTasks.filter(t => t.done[d]).map(t => t.name);
  const pendingTasks = todayTasks.filter(t => !t.done[d]).map(t => t.name);
  const taskContext = `\n\nCurrent day: ${DAYS[d]}. Tasks done today: ${doneTasks.length ? doneTasks.join(', ') : 'none'}. Tasks still pending: ${pendingTasks.length ? pendingTasks.join(', ') : 'none'}.`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: (currentProfile ? currentProfile.systemPrompt : SYSTEM_PROMPT) + taskContext },
          ...aiHistory
        ]
      })
    });
    const data = await res.json();
    const raw = data.choices?.[0]?.message?.content || 'something went wrong, try again!';
    typing.remove();

    // parse out any actions block
    const actionsMatch = raw.match(/~~~actions\s*([\s\S]*?)~~~/);
    const displayText = raw.replace(/~~~actions[\s\S]*?~~~/g, '').trim();

    appendMsg('assistant', displayText || 'done!');
    aiHistory.push({ role: 'assistant', content: raw });

    if (actionsMatch) {
      try { executeActions(actionsMatch[1].trim()); } catch(e) {}
    }
  } catch (e) {
    typing.remove();
    appendMsg('assistant', 'network error — check your API key or connection.');
  }
  sendBtn.disabled = false;
  document.getElementById('aiInput').focus();
}

const mm = String(nowDate.getMinutes()).padStart(2,'0');

document.getElementById('logEnd').value = `${String(endDate.getHours()).padStart(2,'0')}:${String(endDate.getMinutes()).padStart(2,'0')}`;

render();
